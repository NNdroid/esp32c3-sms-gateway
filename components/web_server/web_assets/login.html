<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全登入 - 簡訊轉發器</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --input-bg: #f9fafb;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* 增加一點微妙的背景漸層，讓登入頁面更有質感 */
      background-image: radial-gradient(circle at top right, #e0e7ff, transparent 40%),
                        radial-gradient(circle at bottom left, #dbeafe, transparent 40%);
    }

    .login-box {
      background: var(--card-bg);
      padding: 40px 35px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 360px;
      margin: 20px;
      animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon-container {
      text-align: center;
      font-size: 42px;
      margin-bottom: 15px;
      animation: unlockBounce 1s ease 0.5s;
    }

    @keyframes unlockBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    h2 {
      text-align: center;
      color: var(--text-main);
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background-color: var(--input-bg);
      color: var(--text-main);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
      box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 8px -1px rgba(59, 130, 246, 0.5);
    }

    button:disabled {
      background: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 10px;
      border-radius: var(--radius-sm);
      text-align: center;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none; /* 預設隱藏，若有錯誤可由後端渲染顯示 */
    }

    /* 旋轉動畫 */
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="icon-container">🛡️</div>
    <h2>系統安全登入</h2>
    <div class="subtitle">簡訊轉發器控制台</div>
    
    <div class="error-msg" id="errorMsg">帳號或密碼錯誤，請重試。</div>
    
    <form method="POST" action="/login" id="loginForm">
      <div class="form-group">
        <label for="username">管理員帳號</label>
        <input type="text" id="username" name="username" placeholder="請輸入帳號" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">管理員密碼</label>
        <input type="password" id="password" name="password" placeholder="請輸入密碼" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn">安全登入</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function() {
      const btn = document.getElementById('submitBtn');
      // 點擊後顯示動畫並禁用按鈕，防止重複提交
      btn.disabled = true;
      btn.innerHTML = '<span style="display:inline-block; animation:spin 1s linear infinite;">⏳</span> 正在驗證...';
      
      // 注意：這是一個原生的表單 POST 提交，瀏覽器會自動跳轉。
      // 這個視覺回饋只會在跳轉的幾百毫秒內顯示，提升體驗。
    });
  </script>
</body>
</html>
